name: 🐛 Bug Report
description: Report a defect, unexpected behavior, or broken endpoint
title: "bug: [Short description of the problem]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug and helping improve WittyStatus API!
  - type: textarea
    id: problem_description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Steps or cURL / Fetch command to reproduce the issue.
      placeholder: |
        1. Request endpoint `GET /api/v1/...`
        2. Inspect response status and payload
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, browser (if HTML rendering bug).
      value: |
        - Node.js Version: 
        - Operating System: 
        - Framework (if applicable): 
    validations:
      required: false
